name: Plugin regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PHP regressions
        run: |
          php tests/admin-permissions.php
          php tests/query-detection.php
          php tests/external-waf.php
          php tests/external-waf-storage.php
          php tests/server-blocks.php
      - name: PHP syntax
        run: find wordpress-plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
